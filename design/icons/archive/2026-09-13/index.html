<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agent Office · 아이콘 시안 고르기</title>
  <style>
    :root {
      color-scheme: light;
      --desk: #edf3f8;
      --surface: #fff;
      --plate: #e4edf4;
      --ink: #203652;
      --muted: #5c6c80;
      --line: #cad6e1;
      --accent: #bce7d4;
      --accent-ink: #203652;
      --selected: #365c77;
      --focus: #247866;
      --shadow: 0 5px 0 #d8e2ec;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color: var(--ink);
      background: var(--desk);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --desk: #182338;
      --surface: #24344d;
      --plate: #142035;
      --ink: #f0f5fc;
      --muted: #b4c3d8;
      --line: #43546c;
      --selected: #bce7d4;
      --focus: #bce7d4;
      --shadow: 0 5px 0 #10192a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    button { -webkit-tap-highlight-color: transparent; }
    button, article { transition: background-color 140ms ease, border-color 140ms ease; }
    .page { width: min(1250px, calc(100% - 48px)); margin: 0 auto; padding: 27px 0 18px; }
    .header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 21px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 800; letter-spacing: .11em; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-family: ui-rounded, "Arial Rounded MT Bold", sans-serif; font-size: 11px; letter-spacing: -.03em; box-shadow: 0 2px 0 #96c4b1; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 11px; font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Apple SD Gothic Neo", sans-serif; font-size: clamp(24px, 2.3vw, 32px); font-weight: 800; line-height: 1.25; letter-spacing: -.04em; }
    .intro { margin-top: 6px; font-size: 13px; line-height: 1.6; color: var(--muted); }
    .toolbar { flex: none; display: flex; flex-direction: column; align-items: end; gap: 8px; }
    .theme-switch { display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); gap: 4px; }
    .theme-switch button { min-height: 35px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; font-size: 12px; font-weight: 700; }
    .theme-switch button[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); }
    .theme-dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 1px solid #a6b4c5; border-radius: 50%; background: #edf3f8; vertical-align: -1px; }
    .theme-dot.dark { background: #182338; }
    .local-note { font-size: 11px; color: var(--muted); }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { overflow: hidden; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
    .card.selected { border-color: var(--selected); }
    .card-top { display: flex; align-items: center; gap: 10px; padding: 14px 15px 5px; }
    .number { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 9px; background: var(--desk); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 700; box-shadow: 0 2px 0 var(--line); }
    .selected .number { background: var(--accent); color: var(--accent-ink); border-color: #a6d4c0; box-shadow: 0 2px 0 #a6d4c0; }
    h2 { font-size: 16px; font-weight: 800; letter-spacing: -.025em; }
    .check { margin-left: auto; color: var(--selected); opacity: 0; font-size: 20px; line-height: 1; font-weight: 800; }
    .selected .check { opacity: 1; }
    .visuals { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 13px; }
    .image-button { display: grid; place-items: center; position: relative; flex: 1; min-width: 0; padding: 0; border: 0; border-radius: 13px; background: var(--plate); overflow: hidden; }
    .hero-image { display: block; width: 100%; height: clamp(150px, 18vh, 204px); object-fit: contain; }
    .zoom-label { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; white-space: nowrap; padding: 4px 8px; border: 1px solid #d0dbe7; border-radius: 6px; background: #fffffff2; color: #203652; font-size: 10px; font-weight: 700; }
    .samples { flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 68px; }
    .sample { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .sample img { display: block; object-fit: contain; max-width: none; }
    .sample-32 { width: 32px; height: 32px; }
    .sample-64 { width: 64px; height: 64px; }
    figcaption { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 10px; color: var(--muted); }
    .card-bottom { padding: 0 14px 13px; }
    .description { min-height: 20px; margin-bottom: 9px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .choose { display: block; width: 100%; min-height: 35px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--desk); font-size: 12px; font-weight: 800; }
    .choose:hover { border-color: var(--selected); }
    .choose[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: #a6d4c0; }
    .selection { position: sticky; bottom: 12px; z-index: 2; display: flex; align-items: center; gap: 15px; margin-top: 21px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 7px 24px #101c3021; }
    .selection-label { flex: none; font-size: 12px; font-weight: 800; }
    .selection-text { min-width: 0; flex: 1; }
    #selection-title { font-size: 14px; font-weight: 800; }
    #selection-copy { width: 100%; margin: 5px 0 0; padding: 0; border: none; border-radius: 2px; background: transparent; color: var(--muted); font-size: 11px; text-overflow: ellipsis; }
    .actions { display: flex; flex: none; gap: 7px; }
    .action { min-height: 37px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 12px; font-weight: 700; }
    .primary { color: var(--accent-ink); background: var(--accent); border-color: #a6d4c0; }
    .footer { margin: 15px 3px 0; display: flex; gap: 8px 24px; flex-wrap: wrap; justify-content: space-between; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .status { min-height: 18px; margin: 5px 3px 0; font-size: 11px; color: var(--muted); }
    .viewer { width: min(1080px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--ink); overflow: auto; }
    .viewer::backdrop { background: #101c30bb; backdrop-filter: blur(6px); }
    .viewer-layout { display: grid; grid-template-columns: minmax(0, 1fr) 235px; }
    .viewer-image { display: grid; place-items: center; padding: 18px; min-width: 0; background: var(--plate); }
    #large-image { display: block; width: 100%; max-height: calc(100dvh - 88px); object-fit: contain; }
    .viewer-info { display: flex; flex-direction: column; padding: 18px; gap: 16px; }
    .close { align-self: end; min-width: 40px; min-height: 36px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--desk); font-size: 12px; }
    #large-number { align-self: start; }
    #large-title { font-size: 22px; letter-spacing: -.04em; line-height: 1.3; }
    #large-description { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .viewer-note { color: var(--muted); font-size: 11px; line-height: 1.8; }
    .viewer-navigation { display: flex; gap: 8px; margin-top: auto; }
    .viewer-navigation button { flex: 1; }
    #large-choose { width: 100%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    noscript p { margin: 18px 0; }
    noscript a { color: var(--ink); }
    @media (max-width: 1000px) {
      .page { width: min(840px, calc(100% - 32px)); }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-image { height: 205px; }
      .header { align-items: start; }
      .intro { max-width: 330px; }
      .selection-label { display: none; }
    }
    @media (max-width: 620px) {
      .page { width: calc(100% - 24px); padding-top: 20px; }
      .header { flex-direction: column; gap: 14px; margin-bottom: 16px; }
      .toolbar { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
      .theme-switch button { padding: 0 9px; }
      .local-note { max-width: 120px; text-align: right; line-height: 1.5; }
      .gallery { grid-template-columns: minmax(0, 1fr); gap: 15px; }
      .hero-image { height: min(60vw, 270px); }
      .visuals { gap: 20px; padding: 10px 18px; }
      .card-top { padding: 16px 18px 6px; }
      .card-bottom { padding: 0 18px 16px; }
      .selection { bottom: 6px; flex-wrap: wrap; gap: 10px; padding: 12px; }
      .selection-text { flex-basis: 100%; }
      .actions { width: 100%; }
      .actions .primary { flex: 1; }
      .viewer-layout { grid-template-columns: minmax(0, 1fr); }
      .viewer-info { gap: 11px; }
      .viewer-image { padding: 8px; }
      #large-image { max-height: 52dvh; }
      .viewer-info .close { position: absolute; top: 12px; right: 12px; background: var(--surface); }
      #large-number { display: none; }
      #large-title { font-size: 20px; }
      .viewer-note { display: none; }
      .viewer-navigation { margin-top: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <div class="brand"><span class="brand-mark" aria-hidden="true">AO</span> AGENT OFFICE · ICON CONCEPTS</div>
        <h1>우리 사무실의 얼굴 고르기</h1>
        <p class="intro">큰 이미지와 32·64px 크기를 함께 비교해 보세요.</p>
      </div>
      <div class="toolbar">
        <div class="theme-switch" role="group" aria-label="미리보기 바탕">
          <button type="button" data-theme-choice="light" aria-pressed="true"><span class="theme-dot" aria-hidden="true"></span>밝은 바탕</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false"><span class="theme-dot dark" aria-hidden="true"></span>어두운 바탕</button>
        </div>
        <span class="local-note">선택은 이 화면에만 표시됩니다.</span>
      </div>
    </header>
    <section class="gallery" id="gallery" aria-label="아이콘 시안 6개"></section>
    <noscript><p>큰 이미지는 파일로도 볼 수 있습니다: <a href="01-mini-office.png">01 미니어처 사무실</a> · <a href="02-paper-plane.png">02 종이비행기</a> · <a href="03-desk-buddy.png">03 책상 친구</a> · <a href="04-three-floors.png">04 세 층의 회사</a> · <a href="05-office-camera.png">05 오피스 렌즈</a> · <a href="06-team-keys.png">06 팀 키캡</a></p></noscript>
    <section class="selection" aria-label="선택한 시안">
      <span class="selection-label">선택한 아이콘</span>
      <div class="selection-text">
        <p id="selection-title">마음에 드는 시안을 골라주세요.</p>
        <label class="sr-only" for="selection-copy">복사할 선택 문장</label>
        <input id="selection-copy" readonly value="선택하면 전달할 문장이 여기에 표시됩니다." aria-describedby="status">
      </div>
      <div class="actions">
        <button type="button" class="action" id="clear" disabled>선택 해제</button>
        <button type="button" class="action primary" id="copy" disabled>선택 문장 복사</button>
      </div>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer class="footer">
      <p>현재 1254 × 1254 PNG 시안입니다. 선택 후 투명 여백 정리와 1024px·ICNS 제작을 진행합니다.</p>
      <p>작은 크기는 32·64 CSS px · 원본의 흰 여백 포함</p>
    </footer>
  </main>

  <dialog class="viewer" id="viewer" aria-labelledby="large-title" aria-describedby="large-description">
    <div class="viewer-layout">
      <div class="viewer-image"><img id="large-image" alt=""></div>
      <div class="viewer-info">
        <button class="close" type="button" id="close" autofocus>닫기 ×</button>
        <span class="number" id="large-number" aria-hidden="true"></span>
        <div><h2 id="large-title"></h2><p id="large-description"></p></div>
        <p class="viewer-note">PNG 원본을 비율 그대로 표시합니다.<br>바탕색은 갤러리 설정을 따릅니다.<br>← → 키로 다른 시안을 볼 수 있습니다.</p>
        <div class="viewer-navigation">
          <button type="button" class="action" id="previous" aria-label="이전 시안">← 이전</button>
          <button type="button" class="action" id="next" aria-label="다음 시안">다음 →</button>
        </div>
        <button type="button" class="action primary" id="large-choose">이 시안 선택</button>
      </div>
    </div>
  </dialog>

  <script>
    'use strict';
    const concepts = [
      { number: '01', title: '미니어처 사무실', description: '일하는 직원과 작은 방', file: '01-mini-office.png' },
      { number: '02', title: '종이비행기', description: '에이전트 사이를 오가는 메시지', file: '02-paper-plane.png' },
      { number: '03', title: '책상 친구', description: '키보드 앞의 다정한 로봇', file: '03-desk-buddy.png' },
      { number: '04', title: '세 층의 회사', description: '층마다 함께 일하는 팀', file: '04-three-floors.png' },
      { number: '05', title: '오피스 렌즈', description: '렌즈 너머로 보이는 사무실', file: '05-office-camera.png' },
      { number: '06', title: '팀 키캡', description: '서로 연결된 사람과 책상', file: '06-team-keys.png' },
    ];
    const gallery = document.getElementById('gallery');
    const dialog = document.getElementById('viewer');
    const copyInput = document.getElementById('selection-copy');
    const copyButton = document.getElementById('copy');
    const clearButton = document.getElementById('clear');
    const status = document.getElementById('status');
    const cards = [];
    let selected = null;
    let viewing = 0;
    let lastTrigger = null;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function image(concept, className, alt = '') {
      const node = element('img', className);
      node.src = concept.file;
      node.alt = alt;
      node.decoding = 'async';
      node.draggable = false;
      return node;
    }
    function choose(index) {
      selected = index;
      cards.forEach((entry, cardIndex) => {
        const active = cardIndex === index;
        entry.card.classList.toggle('selected', active);
        entry.button.setAttribute('aria-pressed', String(active));
        entry.button.textContent = active ? '✓ 선택됨' : '이 시안 선택';
      });
      copyButton.disabled = clearButton.disabled = index === null;
      if (index === null) {
        document.getElementById('selection-title').textContent = '마음에 드는 시안을 골라주세요.';
        copyInput.value = '선택하면 전달할 문장이 여기에 표시됩니다.';
        status.textContent = '선택을 해제했습니다.';
        return;
      }
      const concept = concepts[index];
      document.getElementById('selection-title').textContent = `${concept.number} · ${concept.title}`;
      copyInput.value = `Agent Office 앱 아이콘은 ${concept.number}번 ‘${concept.title}’ 시안으로 진행해주세요.`;
      status.textContent = `${concept.number}번 ${concept.title} 시안을 선택했습니다. 앱 아이콘은 아직 적용되지 않았습니다.`;
    }
    function showConcept(index) {
      viewing = (index + concepts.length) % concepts.length;
      const concept = concepts[viewing];
      const large = document.getElementById('large-image');
      large.src = concept.file;
      large.alt = `${concept.number} ${concept.title} 아이콘 시안`;
      document.getElementById('large-number').textContent = concept.number;
      document.getElementById('large-title').textContent = `${concept.number} · ${concept.title}`;
      document.getElementById('large-description').textContent = concept.description;
      document.getElementById('large-choose').textContent = selected === viewing ? '선택한 시안 확인' : '이 시안 선택';
    }

    concepts.forEach((concept, index) => {
      const card = element('article', 'card');
      const top = element('div', 'card-top');
      const number = element('span', 'number', concept.number);
      number.setAttribute('aria-hidden', 'true');
      const title = element('h2', '', concept.title);
      title.id = `concept-${concept.number}`;
      card.setAttribute('aria-labelledby', title.id);
      const check = element('span', 'check', '✓');
      check.setAttribute('aria-hidden', 'true');
      top.append(number, title, check);
      const visuals = element('div', 'visuals');
      const preview = element('button', 'image-button');
      preview.type = 'button';
      preview.setAttribute('aria-label', `${concept.number} ${concept.title} 크게 보기`);
      preview.append(image(concept, 'hero-image'), element('span', 'zoom-label', '↗ 크게 보기'));
      preview.addEventListener('click', () => {
        lastTrigger = preview;
        showConcept(index);
        if (typeof dialog.showModal === 'function') dialog.showModal();
        else window.open(concept.file, '_blank', 'noopener');
      });
      const samples = element('div', 'samples');
      samples.setAttribute('aria-label', '실제 작은 크기 미리보기');
      [32, 64].forEach(size => {
        const sample = element('figure', 'sample');
        const small = image(concept, `sample-${size}`, `${concept.title} ${size}px 미리보기`);
        small.width = small.height = size;
        sample.append(small, element('figcaption', '', `${size}px`));
        samples.append(sample);
      });
      visuals.append(preview, samples);
      const bottom = element('div', 'card-bottom');
      const button = element('button', 'choose', '이 시안 선택');
      button.type = 'button';
      button.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-label', `${concept.number} ${concept.title} 선택`);
      button.addEventListener('click', () => choose(index));
      bottom.append(element('p', 'description', concept.description), button);
      card.append(top, visuals, bottom);
      gallery.append(card);
      cards.push({ card, button });
    });

    document.querySelectorAll('[data-theme-choice]').forEach(button => {
      button.addEventListener('click', () => {
        document.documentElement.dataset.theme = button.dataset.themeChoice;
        document.querySelectorAll('[data-theme-choice]').forEach(choice => {
          choice.setAttribute('aria-pressed', String(choice === button));
        });
      });
    });
    clearButton.addEventListener('click', () => choose(null));
    copyButton.addEventListener('click', async () => {
      if (selected === null) return;
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(copyInput.value);
        status.textContent = '선택 문장을 복사했습니다. 대화에 붙여넣어 주세요.';
      } catch {
        copyInput.focus();
        copyInput.select();
        status.textContent = '선택 문장을 선택했습니다. 복사 단축키를 눌러주세요.';
      }
    });
    document.getElementById('close').addEventListener('click', () => dialog.close());
    document.getElementById('previous').addEventListener('click', () => showConcept(viewing - 1));
    document.getElementById('next').addEventListener('click', () => showConcept(viewing + 1));
    document.getElementById('large-choose').addEventListener('click', () => { choose(viewing); dialog.close(); });
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        showConcept(viewing + (event.key === 'ArrowLeft' ? -1 : 1));
      }
    });
    dialog.addEventListener('close', () => lastTrigger?.focus());
  </script>
</body>
</html>
